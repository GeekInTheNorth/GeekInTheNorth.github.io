{%- assign head_version = site.time | date: '%s' -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://*.optimizely.com https://*.optimizelyedit.com; connect-src 'self' https://*.optimizely.com https://*.optimizelyedit.com https://*.nuget.org; style-src 'self' 'unsafe-inline' https://*.optimizely.com https://*.optimizelyedit.com; font-src 'self'; img-src 'self' data: https://ko-fi.com/; frame-src 'self' https://www.youtube-nocookie.com/ https://*.optimizely.com; object-src 'none'; base-uri 'self';">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111216" media="(prefers-color-scheme: dark)">
<script src="/assets/js/theme.js?v={{ head_version }}"></script>
<script src="/assets/js/site.js?v={{ head_version }}"></script>
<link rel="preload" href="/assets/fonts/newsreader/newsreader-roman.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/instrument-sans/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css?v={{ head_version }}">
{%- if page.extraCss %}
<link rel="stylesheet" href="{{ page.extraCss }}">
{%- endif %}
{% seo %}
