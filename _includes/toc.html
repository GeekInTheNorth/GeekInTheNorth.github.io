{%- comment -%}
  "In this article" contents. The list is built in the post layout and shown twice: as a disclosure on
  small screens and as a sticky rail on wide screens. CSS shows one or the other.
{%- endcomment -%}
<details class="toc toc--compact">
  <summary>In this article</summary>
  {{ include.list }}
</details>
<nav class="toc toc--rail" aria-label="In this article">
  <p class="toc__title">In this article</p>
  {{ include.list }}
</nav>
