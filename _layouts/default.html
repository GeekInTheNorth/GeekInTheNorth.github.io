<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
  {% include head.html %}
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% include site-header.html %}

  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  {% include site-footer.html %}
  {% include cookie-banner.html %}

  {%- assign default_version = site.time | date: '%s' %}
  {%- for default_script in layout.scripts %}
  <script src="/assets/js/{{ default_script }}.js?v={{ default_version }}" defer></script>
  {%- endfor %}
  {%- if page.extraJs %}
  <script src="{{ page.extraJs }}" defer></script>
  {%- endif %}
</body>

</html>
