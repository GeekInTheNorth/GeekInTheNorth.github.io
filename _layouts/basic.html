---
layout: default
---
<article class="wrap basic-page">
  <header class="page-header">
    <h1 class="page-header__title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="standfirst">{{ page.description }}</p>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content | replace: '<table>', '<div class="table-scroll" role="region" aria-label="Table" tabindex="0"><table>' | replace: '</table>', '</table></div>' }}
  </div>
</article>
